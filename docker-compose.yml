name: snapshare

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    volumes:
      - insightface_models:/app/.insightface

  backend:
    build:
      context: ./backend
      dockerfile: ../backend.Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # MONGO_URI is NOT overridden here — it comes from backend/.env,
      # which should point at your shared MongoDB Atlas cluster so that
      # you and your friend hit the same database.
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - redis
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: ../frontend.Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  redis_data:
  insightface_models: