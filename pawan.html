<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | StudentMS</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            background: #f5f7fb;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .login-container {

            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.08);
        }


        .logo {
            text-align: center;

            color: #2563eb;

            font-size: 24px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .login-title {
            text-align: center;

            margin-bottom: 8px;

            color: #1e293b;
        }


        .login-description {
            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #334155;
        }


        .form-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            outline: none;

            font-size: 14px;
        }


        .form-group input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.1);
        }


        .login-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;
        }


        .login-button:hover {
            background: #1d4ed8;
        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #2563eb;

            font-size: 13px;

            text-decoration: none;
        }


        .back-link:hover {
            text-decoration: underline;
        }


        @media (max-width: 500px) {

            .login-container {
                width: 90%;

                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">
            StudentMS
        </div>


        <h2 class="login-title">
            Welcome Back
        </h2>


        <p class="login-description">
            Login to manage student information
        </p>


        <form>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Home
        </a>


    </div>


</body>

</html>
