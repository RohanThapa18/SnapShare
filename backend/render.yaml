# Render Blueprint for SnapShare backend + AI service + Redis.
# MongoDB Atlas and Cloudinary/Razorpay stay external — configure their
# credentials as environment variables in the Render dashboard (never
# commit real values here).
services:
  - type: web
    name: snapshare-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        fromService:
          type: redis
          name: snapshare-redis
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: snapshare-ai
          property: host
      - key: AI_SERVICE_SHARED_SECRET
        generateValue: true
      - key: FACE_MATCH_THRESHOLD
        value: "0.5"
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: snapshare-ai
    runtime: docker
    dockerfilePath: ../ai-service/Dockerfile
    dockerContext: ../ai-service
    plan: starter
    envVars:
      - key: INTERNAL_SHARED_SECRET
        sync: false # must match AI_SERVICE_SHARED_SECRET above
      - key: INSIGHTFACE_MODEL_NAME
        value: buffalo_l
      - key: CTX_ID
        value: "-1"

  - type: redis
    name: snapshare-redis
    plan: starter
    ipAllowList: []
